<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlantViz · Accounts</title>
<meta name="robots" content="noindex">
<script>try { document.documentElement.dataset.theme = localStorage.getItem("pv_theme") === "light" ? "light" : "dark"; } catch {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --fg: #eaeaea; --dim: #8a8a8a; --line: #262626; --acc: #8b93ff; }
  html, body { margin: 0; background: #000; color: var(--fg); font: 14px/1.5 Inter, system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
  .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .k a { color: inherit; text-decoration: none; }
  h1 { font-weight: 300; font-size: 30px; margin: 6px 0 4px; }
  .top { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .top .grow { flex: 1; }
  .top a, .top button { color: var(--dim); font-size: 12px; }
  .tabs { display: flex; gap: 6px; margin: 22px 0 14px; flex-wrap: wrap; }
  button { background: #161616; color: var(--fg); border: 1px solid #333; border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  button:hover { border-color: #777; }
  button.on { border-color: var(--acc); color: #fff; }
  button.ok { border-color: #2f6f3e; } button.bad { border-color: #6f2f2f; }
  select { background: #161616; color: var(--fg); border: 1px solid #333; border-radius: 6px; padding: 5px 6px; font: inherit; font-size: 13px; }
  .tbl { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 400; color: var(--dim); font-size: 12px; }
  td .sub { color: var(--dim); font-size: 12px; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 99px; border: 1px solid #444; }
  .pending { border-color: #a08a2f; color: #e6c75a; } .active { border-color: #2f6f3e; color: #7ee787; }
  .rejected, .suspended { border-color: #6f2f2f; color: #ff8a80; }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  #msg { color: var(--dim); margin: 12px 0; min-height: 1.4em; }
  img.av { width: 28px; height: 28px; border-radius: 50%; vertical-align: middle; margin-right: 8px; }
  html[data-theme="light"] { color-scheme: light; --fg: #1a1a1a; --dim: #5f5f5b; --line: #e0dfdb; --acc: #4650d8; --faint: #d4d3ce; --raise: #f5f4f0; --field: #fff; --err: #c62828; }
  html[data-theme="light"], html[data-theme="light"] body { background: #fff; }
  html[data-theme="light"] button, html[data-theme="light"] select { background: #fff; color: var(--fg); border-color: #cfcec9; }
  html[data-theme="light"] button.on { color: #1a1a1a; }
  html[data-theme="light"] .pending { border-color: #c9a93a; color: #8a6d00; }
  html[data-theme="light"] .active { color: #1f7a38; }
  html[data-theme="light"] .rejected, html[data-theme="light"] .suspended { color: #c62828; }
</style>
</head>
<body>
<div id="gate" hidden></div>
<main id="app" hidden>
  <div class="top"><div><div class="k"><a href="../">PlantViz</a> · Admin</div><h1>Accounts</h1></div><span class="grow"></span>
    <a href="../tool/">Tool</a><a href="../slides/">Slides</a><button id="out">Sign out</button></div>
  <div class="tabs" id="tabs"></div>
  <div id="msg"></div>
  <div class="tbl"><table><thead><tr><th>Person</th><th>Status</th><th>Note</th><th>Activity</th><th>Joined · last sign-in</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</main>
<script src="../assets/auth.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id), esc = PV.esc;
const ROLES = ["viewer", "annotator", "evaluator", "admin"];
const TABS = [["pending", "Waiting"], ["active", "Active"], ["", "All"], ["rejected", "Rejected"], ["suspended", "Suspended"]];
let tab = "pending", me = null;
const day = (s) => (s ? new Date(s).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "—");

async function load() {
  $("tabs").innerHTML = TABS.map(([k, l]) => `<button data-t="${k}" class="${k === tab ? "on" : ""}">${l}</button>`).join("");
  $("msg").textContent = "Loading…";
  let users;
  try { users = await PV.api("/admin/users" + (tab ? `?status=${tab}` : "")); }
  catch (e) { $("msg").textContent = e.message; return; }
  $("msg").textContent = users.length ? "" : tab === "pending" ? "Nobody is waiting for approval." : "No accounts here.";
  $("rows").innerHTML = users.map((u) => {
    const a = u.activity, self = u.id === me.id;
    const roleSel = `<select data-role="${u.id}">${ROLES.map((r) => `<option ${r === (u.status === "active" ? u.role : "annotator") ? "selected" : ""}>${r}</option>`).join("")}</select>`;
    const acts = self ? `<span class="sub">you</span>`
      : u.status === "active"
        ? `${roleSel}<button data-a="approve" data-id="${u.id}">Change role</button><button class="bad" data-a="suspend" data-id="${u.id}">Suspend</button>`
        : `${roleSel}<button class="ok" data-a="approve" data-id="${u.id}">Approve</button>${u.status === "pending" ? `<button class="bad" data-a="reject" data-id="${u.id}">Reject</button>` : ""}`;
    return `<tr><td>${u.picture ? `<img class="av" src="${esc(u.picture)}" referrerpolicy="no-referrer" alt="">` : ""}<b>${esc(u.display_name || u.name)}</b><div class="sub">${esc(u.email)}</div></td>
      <td><span class="pill ${esc(u.status)}">${esc(u.status)}</span><div class="sub">${esc(u.role)}${u.expertise ? " · " + esc(u.expertise) : ""}</div></td>
      <td class="sub">${esc(u.signup_note || "")}</td>
      <td class="sub">${a.annotations} annotations · ${a.reviews} reviews<br>${a.metadata_edits} metadata edits · ${a.exports} exports</td>
      <td class="sub">${day(u.created_at)}<br>${day(u.last_login)}</td>
      <td><div class="acts">${acts}</div></td></tr>`;
  }).join("");
}

document.addEventListener("click", async (e) => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.t !== undefined) { tab = t.dataset.t; return load(); }
  if (t.id === "out") return PV.signOut();
  const id = t.dataset.id, act = t.dataset.a; if (!id) return;
  if ((act === "reject" || act === "suspend") && !confirm(`${act === "reject" ? "Reject" : "Suspend"} this account?`)) return;
  t.disabled = true;
  try {
    const body = act === "approve" ? { role: document.querySelector(`select[data-role="${id}"]`).value } : undefined;
    await PV.api(`/admin/users/${id}/${act}`, { method: "POST", json: body ?? {} });
    await load();
  } catch (err) { $("msg").textContent = err.message; t.disabled = false; }
});

(async function () {
  const a = await PV.signIn($("gate"), { title: "Accounts", what: "the account admin" });
  me = a.user;
  if (me.role !== "admin") { $("app").hidden = false; $("app").innerHTML = `<p style="margin-top:20vh;text-align:center;color:#8a8a8a">This page is for PlantViz admins. <a href="../tool/" style="color:#ccc">Open the tool</a></p>`; return; }
  $("app").hidden = false; load();
})();
</script>
</body>
</html>
